[metadata]
name = eman3
version = 0.1.0
description = EMAN3 - GPU-accelerated cryo-EM processing with NumPy and JAX
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
	numpy
	jax
	jaxlib
	optax

[options.packages.find]
where = .
exclude =
	libEM.*

[options.entry_points]
console_scripts =
	e3x_test_io = examples.e3x_test_io:main

